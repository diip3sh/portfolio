<!doctype html>
<!--
  Orbit gallery asset stage (800x1000 per slide, rendered at 2x).

  Five real captures of Orbit, the macOS menu-bar screen recorder and editor,
  composed onto a dark gallery backdrop:
    #orbit    Editor: a rendered take on the canvas, style sidebar, timeline (card image)
    #orbit-2  Export: MP4 / ProRes / GIF, output sizes, quality tiers
    #orbit-3  Web Recording: live page, agent chat, cursor and scroll lanes
    #orbit-4  Settings → Agents: the MCP server and one-click agent connect
    #orbit-5  Settings → Shortcuts: editable global hotkeys

  The src-*.png windows are captured from the running app (screencapture -l),
  they are not committed. Render with scripts/render-orbit-assets.mjs; upload
  the PNGs to R2 as projects/orbit.png … projects/orbit-5.png.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orbit asset stage</title>
    <style>
      @font-face {
        font-family: "Commit Mono";
        src: url("/public/fonts/CommitMono-400-Regular.otf") format("opentype");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Commit Mono";
        src: url("/public/fonts/CommitMono-500-Regular.otf") format("opentype");
        font-weight: 500;
        font-display: block;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: #050506;
      }

      .slide {
        position: relative;
        width: 800px;
        height: 1000px;
        overflow: hidden;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(110% 80% at 50% 18%, #1b1b1f 0%, #121214 55%, #0a0a0c 100%);
      }

      .slide::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          120% 100% at 50% 110%,
          rgba(0, 0, 0, 0.5) 0%,
          rgba(0, 0, 0, 0) 45%
        );
        pointer-events: none;
      }

      .shot {
        position: relative;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.06) inset,
          0 40px 90px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }

      .shot.wide {
        width: 736px;
      }

      .shot.tall {
        width: 648px;
      }

      .caption {
        position: absolute;
        left: 48px;
        bottom: 44px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-family: "Commit Mono", ui-monospace, monospace;
        z-index: 2;
      }

      .caption .idx {
        font-size: 11px;
        color: #55555c;
      }

      .caption .name {
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #b9b9c0;
      }
    </style>
  </head>
  <body>
    <section class="slide" id="orbit">
      <div class="shot wide"><img src="src-editor.png" alt="Orbit editor" /></div>
      <div class="caption"><span class="idx">01</span><span class="name">Editor</span></div>
    </section>

    <section class="slide" id="orbit-2">
      <div class="shot wide"><img src="src-export.png" alt="Orbit export" /></div>
      <div class="caption"><span class="idx">02</span><span class="name">Export</span></div>
    </section>

    <section class="slide" id="orbit-3">
      <div class="shot wide"><img src="src-web.png" alt="Orbit Web Recording" /></div>
      <div class="caption"><span class="idx">03</span><span class="name">Web Recording</span></div>
    </section>

    <section class="slide" id="orbit-4">
      <div class="shot tall"><img src="src-agents.png" alt="Orbit Agents settings" /></div>
      <div class="caption"><span class="idx">04</span><span class="name">Agents · MCP</span></div>
    </section>

    <section class="slide" id="orbit-5">
      <div class="shot tall"><img src="src-shortcuts.png" alt="Orbit Shortcuts settings" /></div>
      <div class="caption"><span class="idx">05</span><span class="name">Shortcuts</span></div>
    </section>

    <script>
      Promise.all(
        Array.from(document.images).map((img) =>
          img.complete ? Promise.resolve() : img.decode()
        )
      )
        .then(() => document.fonts.ready)
        .then(() => {
          document.body.dataset.ready = "true"
        })
    </script>
  </body>
</html>
